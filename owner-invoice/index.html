<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#1e3a34">
  <title>Doplnenie údajov pobytu</title>
  <style>
    :root{--green:#1e3a34;--paper:#faf7f1;--line:#ded8cb;--muted:#62716c;--danger:#9f342e}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:#22302c;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    header{background:var(--green);color:#fff;padding:28px 20px;border-radius:0 0 28px 28px}header div,main{max-width:540px;margin:auto}
    h1{font-size:25px;margin:5px 0}.sub{opacity:.85;margin:0}main{padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 9px 28px #1e3a3412}
    .summary{background:#f3e8d3;border-radius:12px;padding:12px;margin-bottom:16px}.summary b{display:block}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:750;color:var(--muted);margin-bottom:5px}
    input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}input[readonly]{background:#f5f3ee;color:#53615d}
    .check{display:flex;gap:10px;align-items:flex-start;margin:17px 0}.check input{width:auto;margin-top:5px}.check label{font-size:14px}
    button{width:100%;border:0;border-radius:12px;padding:14px;background:var(--green);color:#fff;font:inherit;font-weight:800}button:disabled{opacity:.55}
    #status{font-weight:700;min-height:24px}.error{color:var(--danger)}.success{color:#17643d}.hidden{display:none}.note{font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <header><div><p class="sub">Faktúra za ubytovanie</p><h1>Doplňte dátum a cenu</h1><p class="sub">Bez potvrdenia sa faktúra nevystaví.</p></div></header>
  <main>
    <section class="card">
      <div id="invalid" class="error hidden">Tento odkaz je neplatný alebo už vypršal. Použite odpoveď na pôvodný e-mail.</div>
      <form id="ownerForm" class="hidden">
        <div class="summary"><span>Hosť</span><b id="guestName"></b><span>Booking ID</span><b id="bookingId"></b></div>
        <div class="field"><label for="checkIn">Dátum príchodu</label><input id="checkIn" type="date" required></div>
        <div class="field"><label for="checkOut">Dátum odchodu</label><input id="checkOut" type="date" required></div>
        <div class="field"><label for="totalGross">Celková cena rezervácie v EUR</label><input id="totalGross" type="number" required min="0.01" max="10000" step="0.01" inputmode="decimal" placeholder="158,00"></div>
        <div class="check"><input id="emailVerified" type="checkbox" required><label for="emailVerified">Porovnala som e-mail a meno hosťa s rezerváciou Booking.com a potvrdzujem správnosť údajov.</label></div>
        <button id="submitButton" type="submit">Vytvoriť a odoslať faktúru</button>
        <p id="status" role="status" aria-live="polite"></p>
        <p class="note">Faktúra sa vystaví len raz. Pri chybe dostanete e-mail na manuálnu kontrolu.</p>
      </form>
    </section>
  </main>
  <script>
    "use strict";
    const form = document.getElementById("ownerForm");
    const invalid = document.getElementById("invalid");
    const status = document.getElementById("status");
    const button = document.getElementById("submitButton");

    function decodeClaims(token) {
      const encoded = token.split(".", 1)[0];
      if (!encoded || encoded.length > 4096) throw new Error("token");
      const padded = encoded.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - encoded.length % 4) % 4);
      const bytes = Uint8Array.from(atob(padded), character => character.charCodeAt(0));
      const claims = JSON.parse(new TextDecoder().decode(bytes));
      if (claims.v !== 1 || !claims.rid || !claims.name || !claims.exp || Date.now() / 1000 > claims.exp) throw new Error("claims");
      return claims;
    }

    const parameters = new URLSearchParams(location.hash.slice(1));
    const token = parameters.get("token") || "";
    let claims;
    try {
      claims = decodeClaims(token);
      document.getElementById("guestName").textContent = claims.name;
      document.getElementById("bookingId").textContent = claims.bid || "doplní systém";
      form.classList.remove("hidden");
    } catch (_) {
      invalid.classList.remove("hidden");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const checkIn = document.getElementById("checkIn").value;
      const checkOut = document.getElementById("checkOut").value;
      const totalGross = document.getElementById("totalGross").value;
      if (checkOut <= checkIn) {
        status.className = "error";
        status.textContent = "Dátum odchodu musí byť po dátume príchodu.";
        return;
      }
      button.disabled = true;
      status.className = "";
      status.textContent = "Odosielam…";
      const payload = {
        _subject: `[FAKTURA-DOPLNENIE] ${claims.rid}`,
        _template: "table",
        _captcha: "false",
        owner_form_version: "1",
        owner_form_token: token,
        request_id: claims.rid,
        "Príchod": checkIn,
        "Odchod": checkOut,
        "Celková cena": totalGross,
        "Booking ID": claims.bid || "—",
        "Potvrdené meno": claims.name,
        email_verified: String(document.getElementById("emailVerified").checked)
      };
      try {
        const response = await fetch("https://formsubmit.co/ajax/povraznikovav@gmail.com", {
          method: "POST",
          headers: {"Content-Type": "application/json", "Accept": "application/json"},
          body: JSON.stringify(payload)
        });
        const responseData = await response.json().catch(() => null);
        if (!response.ok || !responseData || !responseData.success) throw new Error("submit");
        form.querySelectorAll("input,button").forEach(element => element.disabled = true);
        status.className = "success";
        status.textContent = "Údaje boli prijaté. Systém ich skontroluje do 30 sekúnd. Ak pobyt ešte neskončil, faktúru odošle až v deň odchodu.";
      } catch (_) {
        status.className = "error";
        status.textContent = "Odoslanie zlyhalo. Skúste to znova alebo odpovedzte na pôvodný e-mail.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
